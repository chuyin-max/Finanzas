name: Compilar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Localizar o extraer proyecto Android
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE" -type f \\( -name settings.gradle -o -name settings.gradle.kts \\) -not -path '*/.gradle/*' -printf '%h\\n' | head -n 1 || true)"

          if [ -z "$PROJECT_DIR" ]; then
            ARCHIVE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' -print -quit)"
            if [ -z "$ARCHIVE" ]; then
              echo "No se encontro settings.gradle(.kts) ni un ZIP del proyecto."
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/finanzasp-android"
            unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/finanzasp-android"
            PROJECT_DIR="$(find "$RUNNER_TEMP/finanzasp-android" -type f \\( -name settings.gradle -o -name settings.gradle.kts \\) -not -path '*/.gradle/*' -printf '%h\\n' | head -n 1 || true)"
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR/app" ]; then
            echo "No se encontro la raiz Android (se esperaba settings.gradle y la carpeta app/)."
            find "$GITHUB_WORKSPACE" "$RUNNER_TEMP/finanzasp-android" -maxdepth 4 -type f 2>/dev/null | head -n 100 || true
            exit 1
          fi

          echo "Proyecto Android encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/gradle-8.13-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.13-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Generar Gradle Wrapper si hace falta
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.properties ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.13 --distribution-type bin
          fi
          chmod +x gradlew
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Verificar y compilar APK Debug
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Subir APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: FinanzasPatrimonio-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
