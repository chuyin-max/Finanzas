name: Compilar APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Localizar y extraer proyecto Android
        shell: bash
        run: |
          set -euo pipefail

          find_android_root() {
            local root="$1"
            local found=""
            found="$(find "$root" -type f -name settings.gradle.kts -not -path '*/.gradle/*' -print -quit || true)"
            if [ -z "$found" ]; then
              found="$(find "$root" -type f -name settings.gradle -not -path '*/.gradle/*' -print -quit || true)"
            fi
            if [ -n "$found" ]; then
              dirname "$found"
            fi
          }

          PROJECT_DIR="$(find_android_root "$GITHUB_WORKSPACE")"

          if [ -z "$PROJECT_DIR" ]; then
            ARCHIVE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' -print -quit)"
            if [ -z "$ARCHIVE" ]; then
              echo "::error::No se encontró settings.gradle(.kts) ni un ZIP en la raíz del repositorio."
              echo "Contenido de la raíz:"
              ls -la "$GITHUB_WORKSPACE"
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/finanzasp-android"
            unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/finanzasp-android"
            PROJECT_DIR="$(find_android_root "$RUNNER_TEMP/finanzasp-android")"
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::No se encontró una raíz Android válida con settings.gradle y app/."
            echo "Archivos encontrados:"
            find "$GITHUB_WORKSPACE" "$RUNNER_TEMP/finanzasp-android" -maxdepth 5 -type f 2>/dev/null | head -n 120 || true
            exit 1
          fi

          echo "Proyecto Android: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/gradle-8.13-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.13-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Generar o verificar Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.properties ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.13 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Compilar APK Debug
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: FinanzasPatrimonio-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
